name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean stale build cache
        run: ./gradlew clean --stacktrace

      - name: Unit tests
        run: ./gradlew test --no-build-cache --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lovixtv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Publish the debug APK as a GitHub Release so the Pages download page always
      # points at the newest build.  Uses a rolling "latest" tag that gets overwritten
      # on every push — versioned tags (v1.0.0, etc.) are still created by release.yml.
      - name: Name the debug artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/lovixtv-latest.apk
          cp app/build/outputs/apk/debug/*.apk dist/lovixtv.apk

      - name: Generate release notes for this build
        if: github.event_name != 'pull_request'
        id: release_notes
        run: |
          # Get the short commit hash
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT=$(git rev-parse --short $COMMIT_SHA)
          
          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" $COMMIT_SHA)
          
          # Get recent commits (last 5)
          RECENT_COMMITS=$(git log -5 --pretty=format:"- %s (%h)" --no-merges $COMMIT_SHA)
          
          # Create release body
          cat > release_notes.txt <<EOF
          ## LOVIXTV Debug Build
          
          **Version:** 0.11.9  
          **Commit:** $COMMIT_SHORT  
          **Built:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ### Recent Changes
          $RECENT_COMMITS
          
          ---
          
          This is an automated debug build from the main branch.  
          For stable releases, check for versioned tags (v1.0.0, etc.).
          EOF
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish latest build to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest debug build - ${{ steps.release_notes.outputs.RELEASE_NOTES }}"
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          files: dist/*.apk
          make_latest: true
          prerelease: true
          generate_release_notes: false
